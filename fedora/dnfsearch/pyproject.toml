[build-system]
requires = ["setuptools>=61.0", "pydantic>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dnf-search-enricher"
version = "1.0.0"
description = "A Pydantic-powered tool to parse and format `dnf search` output with color-coded categories."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["dnf", "search", "pydantic", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pydantic>=2.5.0",
    "rich>=13.0.0",
]

[project.scripts]
dnf-search = "dnf_search_enricher:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dnf_search_enricher"]

[tool.setuptools.package-data]
"dnf_search_enricher" = ["*.pyi"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = ["src/dnf_search_enricher/*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict_optional = false

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
